<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>减脂进度记录</title>
    <link rel="stylesheet" href="./styles.css?v=20260507-calf" />
  </head>
  <body>
    <div class="pixel-sky" aria-hidden="true">
      <span class="cloud cloud-a"></span>
      <span class="cloud cloud-b"></span>
      <span class="spark spark-a"></span>
      <span class="spark spark-b"></span>
      <span class="spark spark-c"></span>
    </div>
    <main class="app-shell">
      <section class="topbar" aria-label="概览">
        <div>
          <p class="eyebrow">Harvest Log</p>
          <h1>减脂进度记录</h1>
        </div>
        <div class="today-card">
          <span id="todayLabel">今天</span>
          <strong id="summaryText">准备记录</strong>
        </div>
      </section>

      <section class="dashboard-grid">
        <article class="panel weight-panel">
          <div class="panel-head">
            <div>
              <p class="section-kicker">体重记录</p>
              <h2>目标与每日变化</h2>
            </div>
            <button class="ghost-button" id="clearDataButton" type="button">清空</button>
          </div>

          <form class="form-grid" id="weightForm">
            <label>
              当前体重 kg
              <input id="weightInput" type="number" step="0.1" min="20" max="300" placeholder="72.5" required />
            </label>
            <label>
              目标体重 kg
              <input id="targetWeightInput" type="number" step="0.1" min="20" max="300" placeholder="65.0" required />
            </label>
            <label>
              记录日期
              <input id="dateInput" type="date" required />
            </label>
            <button class="primary-button" type="submit">保存体重</button>
          </form>

          <div class="metric-row">
            <div>
              <span>距离目标</span>
              <strong id="weightGap">--</strong>
            </div>
            <div>
              <span>最近趋势</span>
              <strong id="weightTrend">--</strong>
            </div>
            <div>
              <span>记录天数</span>
              <strong id="weightDays">0 天</strong>
            </div>
          </div>

          <div class="chart-wrap">
            <canvas id="weightChart" width="900" height="360" aria-label="每日体重折线图"></canvas>
            <p class="empty-state" id="chartEmpty">保存两天以上体重后显示趋势线</p>
          </div>
        </article>

        <article class="panel body-panel">
          <div class="panel-head">
            <div>
              <p class="section-kicker">身体围度</p>
              <h2>体型变化记录</h2>
            </div>
            <span class="pill" id="bodyStatus">未记录</span>
          </div>

          <form class="body-form" id="bodyForm">
            <label>
              胸围 cm
              <input id="chestInput" type="number" step="0.1" min="40" max="180" placeholder="92.0" />
            </label>
            <label>
              腰围 cm
              <input id="waistInput" type="number" step="0.1" min="40" max="180" placeholder="78.0" />
            </label>
            <label>
              臀围 cm
              <input id="hipInput" type="number" step="0.1" min="40" max="180" placeholder="96.0" />
            </label>
            <label>
              大腿 cm
              <input id="thighInput" type="number" step="0.1" min="25" max="100" placeholder="54.0" />
            </label>
            <label>
              小腿 cm
              <input id="calfInput" type="number" step="0.1" min="15" max="80" placeholder="36.0" />
            </label>
            <label>
              手臂 cm
              <input id="armInput" type="number" step="0.1" min="15" max="70" placeholder="28.0" />
            </label>
            <button class="primary-button" type="submit">保存围度</button>
          </form>

          <div class="metric-row body-metrics">
            <div>
              <span>腰臀比</span>
              <strong id="waistHipRatio">--</strong>
            </div>
            <div>
              <span>腰围变化</span>
              <strong id="waistChange">--</strong>
            </div>
            <div>
              <span>记录次数</span>
              <strong id="bodyDays">0 次</strong>
            </div>
          </div>

          <div class="body-legend" id="bodyLegend"></div>
          <div class="chart-wrap body-chart-wrap">
            <canvas id="measurementsChart" width="900" height="360" aria-label="身体围度折线图"></canvas>
            <p class="empty-state" id="measurementsChartEmpty">保存两次以上围度后显示趋势线</p>
          </div>
        </article>

        <article class="panel diet-panel">
          <div class="panel-head">
            <div>
              <p class="section-kicker">饮食控制</p>
              <h2>摄入与目标对比</h2>
            </div>
            <span class="pill" id="dietStatus">未记录</span>
          </div>

          <form class="target-grid" id="targetForm">
            <label>
              目标热量 kcal
              <input id="targetCalories" type="number" min="500" max="6000" step="10" value="1800" />
            </label>
            <label>
              目标蛋白质 g
              <input id="targetProtein" type="number" min="20" max="400" step="1" value="130" />
            </label>
            <label>
              目标碳水 g
              <input id="targetCarbs" type="number" min="20" max="800" step="1" value="170" />
            </label>
            <label>
              目标脂肪 g
              <input id="targetFat" type="number" min="10" max="300" step="1" value="55" />
            </label>
          </form>

          <form id="dietForm" class="intake-form">
            <label>
              今日总热量 kcal
              <input id="actualCalories" type="number" min="0" max="10000" step="1" placeholder="1971" />
            </label>
            <label>
              今日蛋白质 g
              <input id="actualProtein" type="number" min="0" max="500" step="0.1" placeholder="140.3" />
            </label>
            <label>
              今日碳水 g
              <input id="actualCarbs" type="number" min="0" max="1000" step="0.1" placeholder="179.6" />
            </label>
            <label>
              今日脂肪 g
              <input id="actualFat" type="number" min="0" max="500" step="0.1" placeholder="77.8" />
            </label>
            <button class="primary-button" type="submit">保存总摄入</button>
          </form>

          <div class="nutrition-grid" id="nutritionGrid"></div>
          <div class="diet-archive">
            <div>
              <p class="section-kicker">每日摄入</p>
              <h2>饮食存档</h2>
            </div>
            <span class="pill" id="archiveCount">0 天</span>
          </div>
          <div class="archive-list" id="archiveList"></div>
        </article>

        <article class="panel achievements-panel">
          <div class="panel-head">
            <div>
              <p class="section-kicker">成就模式</p>
              <h2>正在解锁</h2>
            </div>
            <span class="pill strong" id="achievementCount">0 / 0</span>
          </div>
          <div class="achievement-list" id="achievementList"></div>
        </article>
      </section>
    </main>

    <script src="./app.js?v=20260509-archive-delete"></script>
  </body>
</html>
